    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#3350ff"/></linearGradient>
    <radialGradient id="iris" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1b2a7a"/><stop offset=".75" stop-color="#2440d8"/><stop offset="1" stop-color="#4fd1ff"/></radialGradient>
    <radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3a6bff" stop-opacity=".45"/><stop offset="1" stop-color="#3350ff" stop-opacity="0"/></radialGradient>
